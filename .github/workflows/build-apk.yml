
name: Heroes Training Timer APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Revisar archivos del proyecto
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró el ZIP del proyecto."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          WRAPPER=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: El ZIP no contiene gradlew."
            find extracted -maxdepth 4 -type f | head -n 80
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$WRAPPER"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: HeroesTrainingTimer-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
