
name: Heroes Training Timer APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      -       - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar proyecto
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          unzip -q "$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)" -d extracted
          echo "PROJECT_DIR=extracted/HeroesTimer" >> "$GITHUB_ENV"

      - name:          gradle assembleDebug
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: HeroesTrainingTimer-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
